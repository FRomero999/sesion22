<a [routerLink]="['/juego', game().id]" class="juego-tarjeta">
  <img 
    src="https://placehold.co/260x140" 
    alt="{{ alt() }}" 
    class="juego-imagen"
  >
  <div class="juego-info">
    <h3 class="juego-titulo">{{ game().titulo }}</h3>
    <span class="juego-agno">{{ game().agno }}</span>
    <span class="juego-plataforma">{{ game().plataforma }}</span>
    <span class="juego-genero">{{ game().genero }}</span>
  </div>
</a>
